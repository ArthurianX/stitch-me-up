[workspace]
members = [
    "crates/stitch-core",
    "crates/stitch-cli",
    "crates/stitch-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Arthur Kovacs <kovacs.arthur.kraid@gmail.com>"]
rust-version = "1.75"
repository = "https://github.com/ArthurianX/stitch-me-up"
homepage = "https://github.com/ArthurianX/stitch-me-up"
readme = "README.md"
keywords = ["image", "collage", "composition", "layout", "png"]
categories = ["multimedia::images", "graphics"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
