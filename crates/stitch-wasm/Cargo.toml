[package]
name = "stitch-me-up-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "WebAssembly adapter for the 🩹 Stitch Me Up image composition engine"
documentation = "https://docs.rs/stitch-me-up-wasm"
repository.workspace = true
readme = "README.md"   # per-crate readme; workspace-level inheritance resolves against the workspace root
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "stitch_wasm"

[dependencies]
stitch-me-up-core = { path = "../stitch-core", version = "0.5.0" }
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
