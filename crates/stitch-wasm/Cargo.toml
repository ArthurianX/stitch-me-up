[package]
name = "stitch-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "WebAssembly adapter for the 🩹 Stitch Me Up image composition engine"
documentation = "https://docs.rs/stitch-wasm"
repository.workspace = true
homepage.workspace = true
readme = "README.md"   # per-crate readme; workspace-level inheritance resolves against the workspace root
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stitch-core = { path = "../stitch-core", version = "0.4.0" }
wasm-bindgen.workspace = true
js-sys.workspace = true
