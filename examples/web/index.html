<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stitch Me Up — WebAssembly Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0 auto;
        max-width: 760px;
        padding: 24px 16px 48px;
        color: #111827;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 4px;
      }
      .lede {
        color: #4b5563;
        margin-top: 0;
      }
      #status {
        font-size: 0.9rem;
        color: #6b7280;
        margin-bottom: 16px;
      }
      fieldset {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin: 0 0 16px;
        padding: 12px 16px;
      }
      legend {
        font-weight: 600;
        padding: 0 4px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        align-items: center;
        margin: 8px 0;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
      }
      input[type="number"] {
        width: 64px;
      }
      input[type="color"] {
        width: 36px;
        height: 24px;
        padding: 0;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        border: 1px solid #1f2937;
        border-radius: 6px;
        background: #1f2937;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #error {
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        border-radius: 6px;
        padding: 8px 12px;
        margin: 12px 0;
        font-size: 0.9rem;
      }
      #preview {
        display: block;
        max-width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin-top: 16px;
      }
      #download {
        display: inline-block;
        margin-top: 10px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>🩹 Stitch Me Up</h1>
    <p class="lede">
      Pick two or more PNG or JPEG images, tune the composition, and get a PNG back —
      everything runs locally in your browser via WebAssembly.
    </p>
    <p id="status">Loading WebAssembly module…</p>

    <fieldset>
      <legend>Images</legend>
      <div class="row">
        <input type="file" id="files" multiple accept="image/png,image/jpeg" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Composition</legend>
      <div class="row">
        <label>
          Layout
          <select id="layout">
            <option value="vertical">vertical</option>
            <option value="horizontal">horizontal</option>
            <option value="grid">grid</option>
            <option value="before-after">before-after</option>
          </select>
        </label>
        <label>
          Columns
          <input type="number" id="columns" min="1" value="2" />
        </label>
        <label>
          Column weights
          <input type="text" id="column-weights" placeholder="1,2" />
        </label>
        <label>
          Spacing X
          <input type="number" id="spacing-x" min="0" value="0" />
        </label>
        <label>
          Spacing Y
          <input type="number" id="spacing-y" min="0" value="0" />
        </label>
      </div>
      <div class="row">
        <label>
          Pad top
          <input type="number" id="pad-top" min="0" value="0" />
        </label>
        <label>
          Pad right
          <input type="number" id="pad-right" min="0" value="0" />
        </label>
        <label>
          Pad bottom
          <input type="number" id="pad-bottom" min="0" value="0" />
        </label>
        <label>
          Pad left
          <input type="number" id="pad-left" min="0" value="0" />
        </label>
        <label>
          Alignment
          <select id="alignment">
            <option value="start">start</option>
            <option value="center" selected>center</option>
            <option value="end">end</option>
          </select>
        </label>
        <label>
          Resize mode
          <select id="resize-mode">
            <option value="none" selected>none</option>
            <option value="fit-to-same-width">fit-to-same-width</option>
            <option value="fit-to-same-height">fit-to-same-height</option>
          </select>
        </label>
        <label>
          Background
          <input type="color" id="background" value="#ffffff" />
        </label>
      </div>
      <div class="row">
        <label>
          Frame width
          <input type="number" id="frame-width" min="0" value="0" />
        </label>
        <label>
          Frame color
          <input type="color" id="frame-color" value="#000000" />
        </label>
        <label>
          Corner radius
          <input type="number" id="corner-radius" min="0" value="0" />
        </label>
        <label>
          Divider width
          <input type="number" id="divider-width" min="0" value="0" />
        </label>
        <label>
          Divider color
          <input type="color" id="divider-color" value="#000000" />
        </label>
      </div>
    </fieldset>

    <button id="compose" type="button" disabled>Compose</button>

    <div id="error" role="alert" hidden></div>

    <img id="preview" alt="Composed result preview" hidden />
    <a id="download" href="#" download="stitch-result.png" hidden>Download PNG</a>

    <script type="module" src="./main.js"></script>
  </body>
</html>
