<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stitch Me Up — WebAssembly Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="title-row">
        <h1>🩹 Stitch Me Up</h1>
        <span id="version" class="version" hidden></span>
      </div>
      <p class="lede">Compose images in your browser. Nothing is uploaded.</p>
    </header>

    <main class="layout">
      <section class="controls" aria-label="Composition controls">
        <div id="drop" class="drop" aria-label="Drop PNG or JPEG images here">
          <button id="choose" type="button">Choose files</button>
          <p class="drop-hint">or drop PNG/JPEG files here</p>
          <input type="file" id="files" multiple accept="image/png,image/jpeg" class="visually-hidden" />
        </div>

        <ol id="thumbs" class="thumbs" aria-label="Selected images"></ol>

        <ul id="upload-errors" class="upload-errors" role="alert" hidden></ul>

        <fieldset class="panel">
          <legend>Layout</legend>
          <div class="row">
            <label>
              Layout
              <select id="layout">
                <option value="vertical" selected>vertical</option>
                <option value="horizontal">horizontal</option>
                <option value="grid">grid</option>
                <option value="before-after">before-after</option>
              </select>
            </label>
            <label>
              Columns
              <input type="number" id="columns" min="1" value="2" />
            </label>
            <label>
              Weights
              <input type="text" id="weights" placeholder="1,2" autocomplete="off" />
            </label>
            <label>
              Tile shape
              <select id="cell-preset">
                <option value="off" selected>off</option>
                <option value="square">square 320×320</option>
                <option value="portrait">4:5 320×400</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>
              Alignment
              <select id="alignment">
                <option value="start">start</option>
                <option value="center" selected>center</option>
                <option value="end">end</option>
              </select>
            </label>
            <label>
              Resize mode
              <select id="resize-mode">
                <option value="none" selected>none</option>
                <option value="fit-to-same-width">fit-to-same-width</option>
                <option value="fit-to-same-height">fit-to-same-height</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset class="panel">
          <legend>Geometry</legend>
          <div class="row">
            <label>
              Spacing X
              <input type="number" id="spacing-x" min="0" value="0" />
            </label>
            <label>
              Spacing Y
              <input type="number" id="spacing-y" min="0" value="0" />
            </label>
            <label>
              Corner radius
              <input type="number" id="corner-radius" min="0" value="0" />
            </label>
          </div>
          <div class="row">
            <label>
              Pad top
              <input type="number" id="pad-top" min="0" value="0" />
            </label>
            <label>
              Pad right
              <input type="number" id="pad-right" min="0" value="0" />
            </label>
            <label>
              Pad bottom
              <input type="number" id="pad-bottom" min="0" value="0" />
            </label>
            <label>
              Pad left
              <input type="number" id="pad-left" min="0" value="0" />
            </label>
          </div>
        </fieldset>

        <fieldset class="panel">
          <legend>Decoration</legend>
          <div class="row">
            <label>
              Background
              <input type="color" id="background" value="#ffffff" />
            </label>
            <label>
              Frame width
              <input type="number" id="frame-width" min="0" value="0" />
            </label>
            <label>
              Frame color
              <input type="color" id="frame-color" value="#000000" />
            </label>
          </div>
          <div class="row">
            <label>
              Divider width
              <input type="number" id="divider-width" min="0" value="0" />
            </label>
            <label>
              Divider color
              <input type="color" id="divider-color" value="#000000" />
            </label>
          </div>
        </fieldset>

        <fieldset class="panel">
          <legend>Output</legend>
          <div class="row">
            <label>
              Format
              <select id="format">
                <option value="png" selected>png</option>
                <option value="jpeg">jpeg</option>
              </select>
            </label>
            <label>
              JPEG quality
              <input type="number" id="quality" min="1" max="100" value="90" disabled />
            </label>
          </div>
        </fieldset>
      </section>

      <section class="preview-pane" aria-label="Preview">
        <div class="preview-frame">
          <img id="preview" alt="Composed result preview" hidden />
          <p class="preview-empty">No preview yet — add images to start.</p>
        </div>
        <p id="busy" class="busy" hidden>Composing…</p>
        <p id="meta" class="meta"></p>
        <a id="download" href="#" download hidden>Download PNG</a>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="error" role="alert" hidden></div>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://github.com/arthurianx/stitch-me-up">GitHub repository</a>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
