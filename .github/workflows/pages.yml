name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Build wasm package
        working-directory: crates/stitch-wasm
        run: wasm-pack build --target web --out-dir ../../examples/web/pkg

      - name: Run node tests
        run: node --test "examples/web/tests/**/*.test.js"

      - name: Write version.json
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          COMMIT=${GITHUB_SHA:0:7}
          mkdir -p examples/web
          printf '{"version":"%s","commit":"%s"}\n' "$VERSION" "$COMMIT" > examples/web/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
