name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check wasm build
        run: cargo check -p stitch-me-up-wasm --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Build wasm package
        working-directory: crates/stitch-wasm
        run: wasm-pack build --target web --out-dir ../../examples/web/pkg

      - name: Check JS syntax
        run: |
          node --check examples/web/app.js
          node --check examples/web/lib.js

      - name: Run node tests
        run: node --test examples/web/tests/*.test.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-tests/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web-tests/package-lock.json') }}

      - name: Install web-tests dependencies
        working-directory: web-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web-tests
        run: npx playwright test
